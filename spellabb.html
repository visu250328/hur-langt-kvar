<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spellabb – Hur långt är det kvar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#DCEAF6; --done:#F2B33D; --ink:#1D2842; --muted:#56617A; --card:#FFFFFF; --accent:#2F6FD6; --line:#C6D1DF; --edge:#3B424D;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#131F36; --done:#F5C048; --ink:#EDF1F8; --muted:#A6B1C4; --card:#1A2640; --accent:#80B1FF; --line:#2D3B57; --edge:#0C111C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#131F36; --done:#F5C048; --ink:#EDF1F8; --muted:#A6B1C4; --card:#1A2640; --accent:#80B1FF; --line:#2D3B57; --edge:#0C111C;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--sky);color:var(--ink);display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px}
.bar h1{font-size:1.6rem;line-height:1;font-weight:800;margin-right:auto}
.ctl{display:flex;align-items:center;gap:8px;font-weight:700}
.seg{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;border:2px solid var(--line)}
.seg button{border:0;background:transparent;font-weight:700;padding:4px 12px;border-radius:999px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--done);color:#2B1E00}
select{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700}
.small{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-weight:700;cursor:pointer}

/* Listan med spel */
.list{flex:1;overflow:auto;padding:8px 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-content:start}
.game{border:0;background:var(--card);border-radius:24px;padding:18px;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.game .ic{grid-row:span 2;font-size:3rem;line-height:1}
.game .t{font-size:1.35rem;font-weight:800;line-height:1.1}
.game .d{color:var(--muted);line-height:1.3;font-size:.98rem}
.note{padding:0 16px 16px;color:var(--muted);line-height:1.35;max-width:70ch}

/* Spelytan, i den storlek som valts */
.stagewrap{flex:1;min-height:0;position:relative;margin:0 16px 16px;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;background:var(--sky);border:3px solid var(--edge);border-radius:28px;overflow:hidden;transform-origin:center center;box-sizing:border-box}
.stage.fill{left:0;top:0;width:100%;height:100%;border:0;border-radius:0;transform:none}
.log{padding:0 16px 12px;color:var(--muted);font-size:.95rem;min-height:1.4em}
</style>
</head>
<body>
  <div class="bar">
    <h1 id="head">Spellabb</h1>
    <div class="ctl">Nivå
      <div class="seg" id="levelSeg" role="group" aria-label="Nivå">
        <button type="button" data-v="small" aria-pressed="true">Liten (4 år)</button>
        <button type="button" data-v="big" aria-pressed="false">Stor (6 år)</button>
      </div>
    </div>
    <div class="ctl">Ljud
      <div class="seg" id="soundSeg" role="group" aria-label="Ljud">
        <button type="button" data-v="on" aria-pressed="true">På</button>
        <button type="button" data-v="off" aria-pressed="false">Av</button>
      </div>
    </div>
    <label class="ctl">Skärm
      <select id="screen">
        <option value="1180x820">iPad liggande</option>
        <option value="820x1180">iPad stående</option>
        <option value="844x390">Telefon liggande</option>
        <option value="390x844">Telefon stående</option>
        <option value="fill">Hela fönstret</option>
      </select>
    </label>
    <button type="button" class="small" id="back" hidden>Tillbaka till spelen</button>
  </div>

  <div id="listView">
    <div class="list" id="list"></div>
    <p class="note">Spellabbet kör spelen fristående från appen. Nivå och ljud gäller nästa gång ett spel startas. Varje spel sparar sitt läge i webbläsaren; <button type="button" class="small" id="clear">Rensa sparade spel</button></p>
  </div>

  <div id="playView" hidden style="flex:1;min-height:0;display:flex;flex-direction:column">
    <div class="stagewrap" id="stagewrap"><div class="stage" id="stage"></div></div>
    <div class="log" id="log" role="status"></div>
  </div>

<!-- Spelen. Ett nytt spel läggs till med en rad här. -->
<script src="spel/bilbingo.js"></script>
<script src="spel/memory.js"></script>
<script src="spel/monster.js"></script>
<script src="spel/pussel.js"></script>
<script src="spel/kurragomma.js"></script>
<script src="spel/forstabokstaven.js"></script>
<script src="spel/lib/matter.min.js"></script>
<script src="spel/slangbellan.js"></script>
<script src="spel/ballonger.js"></script>
<script src="spel/helikoptern.js"></script>
<script src="spel/klapadockan.js"></script>
<script src="spel/rakna.js"></script>
<script src="spel/parkera.js"></script>
<script src="spel/godis.js"></script>
<script src="spel/farglagg.js"></script>
<script src="spel/prickar.js"></script>
<script src="spel/musik.js"></script>
<script src="spel/byggbilen.js"></script>
<script src="spel/koppla.js"></script>
<script src="spel/panelen.js"></script>
<script src="spel/masken.js"></script>
<script src="spel/murbrytaren.js"></script>
<script src="spel/husdjuret.js"></script>

<script>
const $ = s => document.querySelector(s);
const PREFIX = 'hlk-spel-';
let level = 'small', sound = true, running = null;

function seg(id, onPick){
  document.querySelectorAll(id + ' button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll(id + ' button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    onPick(b.dataset.v);
  }));
}
seg('#levelSeg', v => level = v);
seg('#soundSeg', v => sound = v === 'on');

// Varje spel får en egen del av webbläsarens lagring.
const storageFor = id => ({
  get: k => { try{ return localStorage.getItem(PREFIX + id + '-' + k); }catch(e){ return null; } },
  set: (k, v) => { try{ localStorage.setItem(PREFIX + id + '-' + k, v); }catch(e){} }
});

function list(){
  const games = window.HLK_SPEL || [];
  $('#list').replaceChildren(...games.map(g => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'game';
    b.innerHTML = '<span class="ic"></span><span class="t"></span><span class="d"></span>';
    b.querySelector('.ic').textContent = g.icon;
    b.querySelector('.t').textContent = g.title;
    b.querySelector('.d').textContent = g.about || '';
    b.addEventListener('click', () => play(g));
    return b;
  }));
}

function sizeStage(){
  const v = $('#screen').value, st = $('#stage');
  if(v === 'fill'){ st.className = 'stage fill'; st.style.width = st.style.height = st.style.transform = ''; return; }
  const [w, h] = v.split('x').map(Number), wrap = $('#stagewrap');
  st.className = 'stage';
  st.style.width = w + 'px'; st.style.height = h + 'px';
  const k = Math.min(1, (wrap.clientWidth - 8) / w, (wrap.clientHeight - 8) / h);
  st.style.transform = `translate(-50%, -50%) scale(${k})`;
}
$('#screen').addEventListener('change', () => { sizeStage(); });
window.addEventListener('resize', () => { if(running) sizeStage(); });

function play(g){
  $('#listView').hidden = true; $('#playView').hidden = false; $('#back').hidden = false;
  $('#head').textContent = g.title;
  $('#log').textContent = `Nivå: ${level === 'big' ? 'stor' : 'liten'}. Ljud: ${sound ? 'på' : 'av'}.`;
  sizeStage();
  running = g.start($('#stage'), {
    level, sound, storage: storageFor(g.id),
    onFinish: () => { $('#log').textContent = `${g.title} är klart (onFinish anropades ${new Date().toLocaleTimeString('sv-SE')}).`; }
  });
}
function stop(){
  if(running){ running.stop(); running = null; }
  $('#playView').hidden = true; $('#listView').hidden = false; $('#back').hidden = true;
  $('#head').textContent = 'Spellabb';
}
$('#back').addEventListener('click', stop);
$('#clear').addEventListener('click', () => {
  try{ Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k)); }catch(e){}
  $('#clear').textContent = 'Rensat';
  setTimeout(() => $('#clear').textContent = 'Rensa sparade spel', 1500);
});

list();
</script>
</body>
</html>
